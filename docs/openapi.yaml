openapi: 3.0.3
info:
  title: Translation Management Service
  version: 1.0.0
  description: >
    Token-protected API for locale translations, context tags, search, and a
    CDN-friendly JSON export for frontend applications.
servers:
  - url: http://localhost:8000
    description: Local artisan serve
  - url: http://localhost:8080
    description: Docker nginx
tags:
  - name: Auth
  - name: Languages
  - name: Tags
  - name: Translations
  - name: Export
paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register and receive a bearer token
      description: >
        Optional role is viewer or editor. Omitted role creates a viewer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "422":
          description: Validation failed
  /api/auth/token:
    post:
      tags: [Auth]
      summary: Exchange email and password for a bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Invalid credentials
    delete:
      tags: [Auth]
      summary: Revoke the current bearer token
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Token revoked
        "401":
          description: Unauthenticated
  /api/auth/user:
    get:
      tags: [Auth]
      summary: Current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
        "401":
          description: Unauthenticated
  /api/languages:
    get:
      tags: [Languages]
      summary: List languages
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Language collection
    post:
      tags: [Languages]
      summary: Add a language
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LanguageWrite"
      responses:
        "403":
          description: Requires the editor role (viewers are read-only)
        "201":
          description: Created
        "422":
          description: Validation failed
  /api/languages/{code}:
    parameters:
      - $ref: "#/components/parameters/LocaleCode"
    get:
      tags: [Languages]
      summary: Show a language
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Language
        "404":
          description: Not found
    patch:
      tags: [Languages]
      summary: Update a language name or active flag
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                is_active:
                  type: boolean
      responses:
        "403":
          description: Requires the editor role (viewers are read-only)
        "200":
          description: Updated
        "422":
          description: Validation failed
  /api/tags:
    get:
      tags: [Tags]
      summary: List tags
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tag collection
    post:
      tags: [Tags]
      summary: Create a tag
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: Mobile
      responses:
        "403":
          description: Requires the editor role (viewers are read-only)
        "201":
          description: Created
        "409":
          description: Slug already exists
        "422":
          description: Validation failed
  /api/translations:
    get:
      tags: [Translations]
      summary: Search translations
      description: Filter by key, content, tags, locale, or group. Key search defaults to a prefix match so the unique index can be used.
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: query
          schema:
            type: string
        - name: key_mode
          in: query
          schema:
            type: string
            enum: [prefix, contains, exact]
        - name: content
          in: query
          schema:
            type: string
        - name: locale
          in: query
          schema:
            type: string
        - name: tags
          in: query
          description: Comma-separated slugs or repeated query values
          schema:
            type: string
        - name: tag_mode
          in: query
          schema:
            type: string
            enum: [any, all]
        - name: group
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          description: Opaque cursor from meta.next_cursor / meta.prev_cursor. Omit for the first page.
          schema:
            type: string
        - name: per_page
          in: query
          schema:
            type: integer
            maximum: 100
      responses:
        "200":
          description: >
            Cursor-paginated translations, newest first. No total count is
            computed, so pages stay fast on large datasets; follow
            meta.next_cursor (or links.next, which keeps the filters).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  links:
                    type: object
                    properties:
                      first: { type: string, nullable: true }
                      last: { type: string, nullable: true }
                      prev: { type: string, nullable: true }
                      next: { type: string, nullable: true }
                  meta:
                    type: object
                    properties:
                      path: { type: string }
                      per_page: { type: integer }
                      next_cursor: { type: string, nullable: true }
                      prev_cursor: { type: string, nullable: true }
    post:
      tags: [Translations]
      summary: Create a translation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranslationWrite"
      responses:
        "403":
          description: Requires the editor role (viewers are read-only)
        "201":
          description: Created
        "404":
          description: Locale does not exist
        "409":
          description: Key and locale already exist
        "422":
          description: Validation failed, inactive locale, or unknown tag
  /api/translations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Translations]
      summary: View a translation
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Translation
        "404":
          description: Not found
    put:
      tags: [Translations]
      summary: Update content, description, or tags
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranslationUpdate"
      responses:
        "403":
          description: Requires the editor role (viewers are read-only)
        "200":
          description: Updated
        "422":
          description: Validation failed
    delete:
      tags: [Translations]
      summary: Delete a translation
      security:
        - bearerAuth: []
      responses:
        "403":
          description: Requires the editor role (viewers are read-only)
        "204":
          description: Deleted
        "404":
          description: Not found
  /api/export/{locale}:
    parameters:
      - name: locale
        in: path
        required: true
        schema:
          type: string
          example: en
    get:
      tags: [Export]
      summary: Export translations as JSON
      description: >
        Public by default so frontend apps and a CDN can fetch it. Set
        EXPORT_REQUIRES_AUTH=true to require a bearer token. The response ETag
        includes the translation revision, so clients and CDNs always revalidate
        against the latest write.
      parameters:
        - name: tags
          in: query
          schema:
            type: string
        - name: tag_mode
          in: query
          schema:
            type: string
            enum: [any, all]
        - name: structure
          in: query
          schema:
            type: string
            enum: [flat, nested]
            default: flat
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Fresh export
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
            X-Translation-Version:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportDocument"
        "304":
          description: ETag still matches the current revision
        "404":
          description: Locale not found
        "422":
          description: Locale is inactive
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    LocaleCode:
      name: code
      in: path
      required: true
      schema:
        type: string
        example: en
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        password_confirmation:
          type: string
        device_name:
          type: string
        role:
          type: string
          enum: [viewer, editor]
          default: viewer
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
        device_name:
          type: string
    TokenResponse:
      type: object
      properties:
        token_type:
          type: string
          example: Bearer
        access_token:
          type: string
        expires_at:
          type: string
          nullable: true
        user:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            email:
              type: string
            role:
              type: string
              enum: [editor, viewer]
              description: editor can write; viewer is read-only
    LanguageWrite:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          example: pt-br
        name:
          type: string
        is_active:
          type: boolean
    TranslationWrite:
      type: object
      required: [key, locale, content]
      properties:
        key:
          type: string
          example: auth.login
        locale:
          type: string
          example: en
        content:
          type: string
        description:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
          example: [web, mobile]
    TranslationUpdate:
      type: object
      properties:
        content:
          type: string
        description:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
    ExportDocument:
      type: object
      properties:
        locale:
          type: string
        version:
          type: integer
        generated_at:
          type: string
        count:
          type: integer
        cdn_url:
          type: string
        translations:
          type: object
          additionalProperties: true
